name: workflow

on:
  push:
  pull_request:

jobs:
  setup-node: # ジョブ名(名前は任意)
    runs-on: ubuntu-latest
    timeout-minutes: 10 # デフォルトは360（6時間）のため短い時間で設定しておく

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Cache dependencies # node_modulesのキャッシュ
        id: node_modules_cache_id # キャッシュID(名前は任意)
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-key-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable --ignore-scripts

  build-storybook:
    if: github.event_name == 'pull_request'
    runs-on: setup-node
    timeout-minutes: 10
    env:
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable --ignore-scripts

      - name: Storybook-static Building
        run: yarn build-storybook

  deploy-storybook-static: # ジョブ名(名前は任意)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: setup-node # 分岐元のジョブ
    timeout-minutes: 10
    env:
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Restore node_modules # キャッシュしたnode_modulesの使用
        id: node_modules_cache_id # キャッシュしたnode_modulesのID
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-key-${{ hashFiles('**/yarn.lock') }}

      - name: Storybook-static Building
        run: yarn build-storybook

      - name: FTP-Deploy-Action
        uses: SamKirkland/FTP-Deploy-Action@4.1.0 # FTPを使ってサーバーにDeployするアクションを実行
        with:
          server: ${{ secrets.FTP_SERVER }} # FTPサーバーのURLを設定
          username: ${{ secrets.FTP_USERNAME }} # FTPのユーザー名を設定
          password: ${{ secrets.FTP_PASSWORD }} # FTPのパスワードを設定
          local-dir: ./storybook-static/ # どのディレクトリのデータをアップロードするか
          server-dir: /storybook_for_expo/ # リモートのどのディレクトリにアップロードするか

  prettier-eslint-checker: # ジョブ名(名前は任意)
    runs-on: ubuntu-latest
    needs: setup-node # 分岐元のジョブ
    timeout-minutes: 10
    env:
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Restore node_modules # キャッシュしたnode_modulesの使用
        id: node_modules_cache_id # キャッシュしたnode_modulesのID
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-key-${{ hashFiles('**/yarn.lock') }}

      - name: Prettier-eslint Checker
        run: yarn checker # Prettier・ESlintで未フォーマット箇所やLintエラーを検出

  vitest-run:
    runs-on: ubuntu-latest
    needs: setup-node
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Restore node_modules
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-key-${{ hashFiles('**/yarn.lock') }}

      - name: Unit tests with coverage
        run: yarn test:coverage
